agent:
  step_limit: 50
  cost_limit: 0.75
  wall_time_limit_seconds: 7200
model:
  cost_tracking: ignore_errors
environment:
  timeout: 240
  container_timeout: "3h"
  pull_timeout: 900
  run_args:
    - "--rm"
    - "--network"
    - "none"
    - "--cpus"
    - "2"
    - "--memory"
    - "8g"
    - "--memory-swap"
    - "8g"
    - "--user"
    - "agent"
    - "--cap-drop"
    - "SYS_PTRACE"
