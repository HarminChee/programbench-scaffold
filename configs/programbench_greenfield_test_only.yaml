# mini-swe-agent override for the ProgramBench executable-test upper-bound setting.
#
# Merge order should be:
#   1. mini-swe-agent built-in benchmarks/programbench.yaml
#   2. this file
#   3. local resource/model config, e.g. configs/programbench_mac_smoke.yaml

agent:
  system_template: |
    You are a helpful coding agent that can interact with a no-internet computer.

    This is a ProgramBench greenfield implementation task. You are asked to
    implement a fresh codebase from the available documentation and provided
    executable tests.

    The allowed sources of behavioral requirements are:
    - documentation already present in the workspace
    - sanitized executable tests under `./oracle_tests`
    - outputs from running your own implementation against those tests

    The provided tests are an upper-bound specification scaffold. Use them to
    understand required CLI behavior, stdin/stdout/stderr behavior, exit codes,
    file handling, formatting, and edge cases.

    <RULES>
    ## What is not allowed

    ### 1. Obtaining source code

    You must not search the internet, package registries, or any external
    source for this project's implementation. Even if you recognize the
    project, implement it yourself from the available docs and tests.

    This includes but is not limited to:
    - cloning or browsing the original GitHub repository, its forks, or mirrors
    - downloading the project from package registries
    - fetching source tarballs from project websites
    - reading cached source downloaded through a package manager

    ### 2. Wrapping or reusing the original tool

    Your submission must be a genuine implementation. Do not wrap, copy, shim,
    install, or delegate to any prebuilt version of the same tool.

    If a reference executable is present because of the original ProgramBench
    image layout, it is not your final artifact. Your final solution must be
    produced by your own `./compile.sh`.

    ### 3. Binary analysis

    Do not decompile or disassemble any provided reference executable. Do not
    use strace, ltrace, or similar tracing/instrumentation tools on it.

    You may use normal development tools on binaries you produce yourself.

    ## What is allowed

    - reading bundled documentation
    - reading and running sanitized tests under `./oracle_tests`
    - writing original source code
    - running your own `./compile.sh` and `./executable`
    - using already-installed system packages and language tooling available in
      the no-internet container
    </RULES>

  instance_template: |
    ## Task context

    Implement the source code for a command-line program from scratch.

    You have access to:
    - documentation files already available in the workspace
    - sanitized executable oracle tests under `./oracle_tests`

    The tests are intentionally provided as behavioral requirements for this
    upper-bound experiment. They do not include the original implementation
    source code.

    ## Your task

    Create a working implementation that passes as many official ProgramBench
    tests as possible.

    Requirements:
    - create `./compile.sh`
    - `./compile.sh` must produce an executable at `./executable`
    - do not commit generated binaries or build artifacts
    - commit your source changes before finishing

    Useful test commands:

    ```bash
    ./oracle_tests/run_branch.sh <branch-id>
    ./oracle_tests/run_all.sh
    ```

    Start by reading documentation and `./oracle_tests/README.md`. Then inspect
    the test names/files enough to choose an implementation strategy. Keep the
    first implementation simple and compiling; expand behavior iteratively using
    the executable tests.

    ## Command Execution Rules

    You can execute bash commands and edit files to implement the necessary
    changes.

    You are operating in an environment where:

    1. You issue at least one command.
    2. The system executes the command(s) in a subshell.
    3. You see the result(s).
    4. You write your next command(s).

    Each response should include:

    1. reasoning text where you explain your analysis and plan
    2. at least one bash tool call with your command

    Critical requirements:

    - your response must include at least one bash tool call
    - directory and environment variable changes are not persistent across
      commands unless you include them in the command
    - submit your changes and finish by issuing exactly:
      `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>
